<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bộ Sưu Tập & Tải Truyện</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* Top Bar cho di động */
    .top-bar { display: flex; align-items: center; padding: 12px 16px; background: #182234; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 90; }
    .menu-toggle { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; padding: 4px; display: flex; align-items: center; }

    /* Sidebar Menu (Thanh bên trái) */
    .sidebar { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: #162032; border-right: 1px solid var(--border); z-index: 100; transition: left 0.3s ease; padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; }
    .sidebar.open { left: 0; }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 95; display: none; }
    .sidebar-overlay.active { display: block; }

    .nav-btn { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-sub); font-size: 0.95rem; font-weight: 600; cursor: pointer; text-align: left; width: 100%; transition: all 0.2s; }
    .nav-btn.active { background: var(--primary); color: #fff; border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    /* Khu vực Lưới (Grid Content) */
    .main-content { padding: 16px; max-width: 800px; margin: 0 auto; }
    .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .grid-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: transform 0.2s, border-color 0.2s; }
    .grid-item:active { transform: scale(0.97); border-color: var(--primary); }
    .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
    .grid-item-placeholder { font-size: 2.5rem; }
    .grid-item-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px; background: rgba(0, 0, 0, 0.7); font-size: 0.75rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Cửa sổ Nổi Popup (Modal) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 200; display: none; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    
    .modal-box { background: #000; border: 2px solid #ffffff; border-radius: 16px; width: 100%; max-width: 440px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); animation: zoomIn 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-header { padding: 12px 16px; background: #162032; border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
    .btn-close { background: none; border: none; color: var(--text-sub); font-size: 1.4rem; cursor: pointer; padding: 0 4px; line-height: 1; }

    .modal-body { width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; overflow-y: auto; padding: 12px; }
    .modal-body img, .modal-body video { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 8px; }

    .volume-box { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #162032; border-top: 1px solid var(--border); }
    .volume-box span { font-size: 0.8rem; color: var(--text-sub); }
    .volume-slider { flex: 1; accent-color: var(--primary); height: 5px; cursor: pointer; }

    .zip-modal-content { text-align: center; display: flex; flex-direction: column; gap: 16px; padding: 20px; }
    .btn-download { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; text-decoration: none; font-weight: 600; font-size: 0.9rem; border-radius: 10px; }

    .status-box { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-sub); }
  </style>
</head>
<body>

  <!-- Top Bar có nút Menu ☰ -->
  <div class="top-bar">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <span style="margin-left: 12px; font-weight: 600;" id="page-title">Video</span>
  </div>

  <!-- Sidebar Menu Bên Trái -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <button class="nav-btn active" onclick="switchCategory('video', this)">🎬 Video</button>
    <button class="nav-btn" onclick="switchCategory('image', this)">🖼️ Ảnh</button>
    <button class="nav-btn" onclick="switchCategory('zip', this)">📦 Tệp ZIP</button>
  </div>

  <!-- Lưới Hiển Thị Nội Dung -->
  <div class="main-content">
    <div class="grid-container" id="grid-container">
      <div class="status-box">Đang tải...</div>
    </div>
  </div>

  <!-- Popup Modal Xem Chi Tiết -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modal-title">Tiêu đề</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div id="modal-footer"></div>
    </div>
  </div>

  <script>
    const supabaseClient = supabase.createClient(
      'https://mzulupuvaslegxclsyck.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16dWx1cHV2YXNsZWd4Y2xzeWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzQxMzQsImV4cCI6MjEwNDExMDEzNH0.0iz8DsFpxGoWnELDd3F4ONqRNgG0nwkKzsYHoh2B-x0'
    );

    let allMediaData = [];
    let currentCategory = 'video';

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    async function loadData() {
      const { data, error } = await supabaseClient.from('media').select('*').order('id', { ascending: false });
      if (error || !data || data.length === 0) {
        document.getElementById('grid-container').innerHTML = '<div class="status-box">Chưa có nội dung.</div>';
        return;
      }
      allMediaData = data;
      renderGrid();
    }

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('page-title').innerText = btn.innerText;
      toggleSidebar();
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('grid-container');
      grid.innerHTML = '';
      const filtered = allMediaData.filter(item => item.type === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="status-box">Không có nội dung.</div>';
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.onclick = () => openModal(item);

        if (item.type === 'video') {
          div.innerHTML = `<video src="${item.url}#t=0.5" preload="metadata"></video><div class="grid-item-title">${item.title}</div>`;
        } else if (item.type === 'image') {
          div.innerHTML = `<img src="${item.url}" loading="lazy"><div class="grid-item-title">${item.title}</div>`;
        } else {
          div.innerHTML = `<div class="grid-item-placeholder">📚</div><div class="grid-item-title">${item.title}</div>`;
        }
        grid.appendChild(div);
      });
    }

    function openModal(item) {
      const modalBody = document.getElementById('modal-body');
      const modalFooter = document.getElementById('modal-footer');
      document.getElementById('modal-title').innerText = item.title;

      modalFooter.innerHTML = '';

      if (item.type === 'video') {
        const vidId = `modal-vid-${item.id}`;
        modalBody.innerHTML = `
          <video id="${vidId}" controls autoplay playsinline style="width:100%;">
            <source src="${item.url}" type="video/mp4">
          </video>`;
        modalFooter.innerHTML = `
          <div class="volume-box">
            <span>🔊 Âm lượng</span>
            <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1" 
                   oninput="document.getElementById('${vidId}').volume = this.value">
          </div>`;
      } else if (item.type === 'image') {
        modalBody.innerHTML = `<img src="${item.url}" alt="${item.title}">`;
      } else if (item.type === 'zip') {
        modalBody.innerHTML = `
          <div class="zip-modal-content">
            <div style="font-size: 3rem;">📦</div>
            <a href="${item.url}" class="btn-download" download target="_blank">
              ⬇️ Tải Về Tệp ZIP
            </a>
          </div>`;
      }

      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'modal-overlay' || e.target.classList.contains('btn-close')) {
        const modalBody = document.getElementById('modal-body');
        const video = modalBody.querySelector('video');
        if (video) video.pause(); // Tắt tiếng/dừng video khi đóng
        document.getElementById('modal-overlay').classList.remove('active');
      }
    }

    loadData();
  </script>
</body>
</html>
